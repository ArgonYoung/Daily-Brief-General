# fly.toml app configuration file

app = "argons-daily-brief"
primary_region = "hkg" # Defaulting to Hong Kong (UTC+8). Change as desired.

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "brief_data"
  destination = "/data"

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/dev.db"
  NODE_ENV = "production"
